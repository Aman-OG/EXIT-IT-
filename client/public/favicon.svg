<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="tasselGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background container with rounded corners -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" />

  <!-- Graduation Cap -->
  <g filter="url(#glow)" transform="translate(14, 20)">
    <!-- Mortarboard Diamond -->
    <polygon points="50,14 96,38 50,56 4,38" fill="#ffffff" />
    
    <!-- Cap Base / Skullcap -->
    <path d="M26,45 L26,66 Q50,84 74,66 L74,45 L50,56 Z" fill="#e2e8f0" opacity="0.95" />

    <!-- Tassel Cord -->
    <path d="M50,42 Q30,48 24,62 L24,78" fill="none" stroke="url(#tasselGrad)" stroke-width="4" stroke-linecap="round" />
    
    <!-- Tassel Knot -->
    <circle cx="24" cy="79" r="4.5" fill="#fbbf24" />
    
    <!-- Tassel Fringe -->
    <polygon points="20,83 24,93 28,83" fill="#f59e0b" />

    <!-- Center Top Button -->
    <circle cx="50" cy="40" r="5" fill="#fbbf24" />
  </g>
</svg>